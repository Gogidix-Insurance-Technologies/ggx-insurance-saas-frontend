name: CD - Deploy to Production

on:
  push:
    branches: [production]
  workflow_dispatch:
    inputs:
      frontend:
        description: 'Specific frontend to deploy (or "all")'
        required: false
        default: 'all'

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  NODE_VERSION: '20'

jobs:
  approval-gate:
    name: Production Approval Gate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Confirm deployment
        run: |
          echo "## Production Deployment Approved" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Approved by:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u)" >> $GITHUB_STEP_SUMMARY

  prepare:
    name: Prepare Production Deployment
    needs: approval-gate
    runs-on: ubuntu-latest
    outputs:
      frontends: ${{ steps.set.outputs.frontends }}
    steps:
      - id: set
        run: |
          if [ "${{ github.event.inputs.frontend }}" != "" ] && [ "${{ github.event.inputs.frontend }}" != "all" ]; then
            echo "frontends=[\"${{ github.event.inputs.frontend }}\"]" >> $GITHUB_OUTPUT
          else
            echo 'frontends=["admin-console","customer-portal","executive-dashboard","hr-portal","digital-sales-portal","support-center","broker-portal"]' >> $GITHUB_OUTPUT
          fi

  deploy-production:
    name: Deploy ${{ matrix.frontend }} to Production
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        frontend: ${{ fromJson(needs.prepare.outputs.frontends) }}

    environment:
      name: production
      url: https://${{ matrix.frontend }}.ggx-insurance.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.frontend }}/package.json

      - name: Install dependencies
        working-directory: ${{ matrix.frontend }}
        run: |
          npm install --install-strategy=nested --legacy-peer-deps
          npm install @esbuild/linux-x64 --save-dev || true

      - name: Build for production
        working-directory: ${{ matrix.frontend }}
        env:
          VITE_API_URL: https://api.ggx-insurance.com
          VITE_ENV: production
        run: npm run build

      - name: Deploy to Cloudflare Pages (Production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ matrix.frontend }}-prod
          workingDirectory: ${{ matrix.frontend }}

      - name: Verify deployment
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://${{ matrix.frontend }}.ggx-insurance.com || echo "000")
          echo "## Production Deployment: ${{ matrix.frontend }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | Production |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | https://${{ matrix.frontend }}.ggx-insurance.com |" >> $GITHUB_STEP_SUMMARY
          echo "| HTTP Status | ${STATUS} |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Deployed by | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY

  post-deploy-healthcheck:
    name: Post-Deploy Health Check
    needs: deploy-production
    runs-on: ubuntu-latest
    steps:
      - name: Run health checks
        run: |
          echo "## Post-Deployment Health Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          for frontend in admin-console customer-portal executive-dashboard hr-portal digital-sales-portal support-center broker-portal; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://${frontend}.ggx-insurance.com 2>/dev/null || echo "000")
            if [ "$STATUS" == "200" ] || [ "$STATUS" == "301" ] || [ "$STATUS" == "302" ]; then
              echo "| ${frontend} | ✅ ${STATUS} |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| ${frontend} | ❌ ${STATUS} |" >> $GITHUB_STEP_SUMMARY
            fi
          done

  rollback-notification:
    name: Rollback Info
    needs: deploy-production
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Generate rollback instructions
        run: |
          echo "## ⚠️ Production Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Rollback Steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. Go to Cloudflare Dashboard → Pages → Select project" >> $GITHUB_STEP_SUMMARY
          echo "2. Find the last successful deployment" >> $GITHUB_STEP_SUMMARY
          echo "3. Click 'Rollback to this deployment'" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Failed commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
