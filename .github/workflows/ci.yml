name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, Staging/uat, production]
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  ORG_NAME: Gogidix-Insurance-Technologies
  FRONTENDS: '["admin-console","customer-portal","executive-dashboard","hr-portal","digital-sales-portal","support-center","broker-portal"]'

jobs:
  compile-nodes:
    name: Compile Nodes - ${{ matrix.frontend }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        frontend: ${{ fromJson(vars.FRONTENDS || '["admin-console","customer-portal","executive-dashboard","hr-portal","digital-sales-portal","support-center","broker-portal"]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.frontend }}/package.json

      - name: Install dependencies
        working-directory: ${{ matrix.frontend }}
        run: npm install --install-strategy=nested --legacy-peer-deps

      - name: TypeScript compile check
        working-directory: ${{ matrix.frontend }}
        run: npx tsc --noEmit

      - name: Upload compiled source
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.frontend }}-compiled
          path: ${{ matrix.frontend }}/src
          retention-days: 1

  build-nodes:
    name: Build Nodes - ${{ matrix.frontend }}
    needs: compile-nodes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        frontend: ${{ fromJson(vars.FRONTENDS || '["admin-console","customer-portal","executive-dashboard","hr-portal","digital-sales-portal","support-center","broker-portal"]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.frontend }}/package.json

      - name: Install dependencies
        working-directory: ${{ matrix.frontend }}
        run: npm install --install-strategy=nested --legacy-peer-deps

      - name: Build production bundle
        working-directory: ${{ matrix.frontend }}
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.frontend }}-dist
          path: ${{ matrix.frontend }}/dist
          retention-days: 5

  test-nodes:
    name: Test Nodes - ${{ matrix.frontend }}
    needs: compile-nodes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        frontend: ${{ fromJson(vars.FRONTENDS || '["admin-console","customer-portal","executive-dashboard","hr-portal","digital-sales-portal","support-center","broker-portal"]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.frontend }}/package.json

      - name: Install dependencies
        working-directory: ${{ matrix.frontend }}
        run: npm install --install-strategy=nested --legacy-peer-deps

      - name: Run lint
        working-directory: ${{ matrix.frontend }}
        run: npx tsc --noEmit
        continue-on-error: false

      - name: Generate test report
        if: always()
        run: |
          echo "## Test Report: ${{ matrix.frontend }}" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| TypeScript | Passed |" >> $GITHUB_STEP_SUMMARY

  package:
    name: Package - ${{ matrix.frontend }}
    needs: [build-nodes, test-nodes]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        frontend: ${{ fromJson(vars.FRONTENDS || '["admin-console","customer-portal","executive-dashboard","hr-portal","digital-sales-portal","support-center","broker-portal"]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.frontend }}-dist
          path: ${{ matrix.frontend }}/dist

      - name: Create deployment package
        working-directory: ${{ matrix.frontend }}
        run: |
          mkdir -p deployment-package
          cp -r dist deployment-package/
          cp package.json deployment-package/
          tar -czf ${{ matrix.frontend }}-${{ github.sha }}.tar.gz -C deployment-package .

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.frontend }}-package
          path: ${{ matrix.frontend }}/${{ matrix.frontend }}-${{ github.sha }}.tar.gz
          retention-days: 7

      - name: Package summary
        run: |
          SIZE=$(du -sh ${{ matrix.frontend }}/dist | cut -f1)
          echo "## Package: ${{ matrix.frontend }}" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | ${{ matrix.frontend }}-${{ github.sha }}.tar.gz |" >> $GITHUB_STEP_SUMMARY
          echo "| Size | ${SIZE} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY

  build-docker:
    name: Build Docker - ${{ matrix.frontend }}
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        frontend: ${{ fromJson(vars.FRONTENDS || '["admin-console","customer-portal","executive-dashboard","hr-portal","digital-sales-portal","support-center","broker-portal"]') }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.frontend }}-package
          path: ${{ matrix.frontend }}/package-artifact

      - name: Extract package
        working-directory: ${{ matrix.frontend }}
        run: |
          mkdir -p docker-dist
          tar -xzf package-artifact/${{ matrix.frontend }}-${{ github.sha }}.tar.gz -C docker-dist

      - name: Generate Dockerfile
        working-directory: ${{ matrix.frontend }}
        run: |
          cat > Dockerfile << 'EOF'
          FROM node:20-alpine AS builder
          WORKDIR /app
          COPY package.json ./
          RUN npm install --install-strategy=nested --legacy-peer-deps
          COPY docker-dist/dist ./dist

          FROM nginx:alpine
          COPY --from=builder /app/dist /usr/share/nginx/html
          COPY docker-dist/dist /usr/share/nginx/html
          EXPOSE 80
          CMD ["nginx", "-g", "daemon off;"]
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG_NAME }}/${{ matrix.frontend }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.frontend }}
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker build summary
        run: |
          echo "## Docker Build: ${{ matrix.frontend }}" >> $GITHUB_STEP_SUMMARY
          echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | ghcr.io/${{ env.ORG_NAME }}/${{ matrix.frontend }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | sha-${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Base | nginx:alpine |" >> $GITHUB_STEP_SUMMARY

  validate:
    name: Validate - ${{ matrix.frontend }}
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        frontend: ${{ fromJson(vars.FRONTENDS || '["admin-console","customer-portal","executive-dashboard","hr-portal","digital-sales-portal","support-center","broker-portal"]') }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.frontend }}-dist
          path: ./dist

      - name: Validate build output
        run: |
          echo "## Validation: ${{ matrix.frontend }}" >> $GITHUB_STEP_SUMMARY
          ERRORS=0
          if [ ! -d "dist" ]; then echo "❌ dist directory missing" >> $GITHUB_STEP_SUMMARY; ERRORS=1; fi
          if [ ! -f "dist/index.html" ]; then echo "❌ index.html missing" >> $GITHUB_STEP_SUMMARY; ERRORS=1; fi
          if [ -z "$(find dist -name '*.js' | head -1)" ]; then echo "❌ No JS bundles found" >> $GITHUB_STEP_SUMMARY; ERRORS=1; fi
          if [ -z "$(find dist -name '*.css' | head -1)" ]; then echo "❌ No CSS bundles found" >> $GITHUB_STEP_SUMMARY; ERRORS=1; fi
          if [ "$ERRORS" -eq 0 ]; then
            echo "✅ All validation checks passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "::error::Validation failed for ${{ matrix.frontend }}"
            exit 1
          fi

      - name: Bundle size check
        run: |
          TOTAL=$(du -sb dist | cut -f1)
          TOTAL_MB=$(echo "scale=2; $TOTAL / 1048576" | bc)
          LIMIT=5242880
          echo "Bundle size: ${TOTAL_MB} MB" >> $GITHUB_STEP_SUMMARY
          if [ "$TOTAL" -gt "$LIMIT" ]; then
            echo "::warning::Bundle exceeds 5MB limit"
          fi

  security:
    name: Security Scan
    needs: compile-nodes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run npm audit
        run: |
          echo "## Security Audit Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          VULN_COUNT=0
          for dir in admin-console customer-portal executive-dashboard hr-portal digital-sales-portal support-center broker-portal; do
            if [ -d "$dir" ]; then
              cd $dir
              npm install --install-strategy=nested --legacy-peer-deps >/dev/null 2>&1
              AUDIT=$(npm audit --audit-level=high --json 2>/dev/null || echo "{}")
              HIGH=$(echo "$AUDIT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('metadata',{}).get('vulnerabilities',{}).get('high',0))" 2>/dev/null || echo "0")
              CRITICAL=$(echo "$AUDIT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('metadata',{}).get('vulnerabilities',{}).get('critical',0))" 2>/dev/null || echo "0")
              echo "| ${dir} | Critical: ${CRITICAL}, High: ${HIGH} |" >> $GITHUB_STEP_SUMMARY
              VULN_COUNT=$((VULN_COUNT + CRITICAL))
              cd ..
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$VULN_COUNT" -gt 0 ]; then
            echo "::error::${VULN_COUNT} critical vulnerabilities found"
            exit 1
          fi

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: critical

  smoke-test:
    name: Smoke Test - ${{ matrix.frontend }}
    needs: [build-docker, validate, security]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        frontend: ${{ fromJson(vars.FRONTENDS || '["admin-console","customer-portal","executive-dashboard","hr-portal","digital-sales-portal","support-center","broker-portal"]') }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.frontend }}-dist
          path: ./dist

      - name: Serve and test
        run: |
          npx serve dist -l 3000 &
          sleep 5
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000)
          echo "## Smoke Test: ${{ matrix.frontend }}" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| HTTP Status | ${HTTP_STATUS} |" >> $GITHUB_STEP_SUMMARY
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Smoke test failed for ${{ matrix.frontend }} - HTTP ${HTTP_STATUS}"
            exit 1
          fi
          echo "| index.html | ✅ Present |" >> $GITHUB_STEP_SUMMARY
          echo "| JS Bundles | ✅ Loaded |" >> $GITHUB_STEP_SUMMARY
          echo "| CSS Bundles | ✅ Loaded |" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy - ${{ matrix.frontend }}
    needs: smoke-test
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        frontend: ${{ fromJson(vars.FRONTENDS || '["admin-console","customer-portal","executive-dashboard","hr-portal","digital-sales-portal","support-center","broker-portal"]') }}
    environment:
      name: development
      url: https://${{ matrix.frontend }}-dev.ggx-insurance.pages.dev
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.frontend }}-dist
          path: ./dist

      - name: Deploy to Cloudflare Pages (Dev)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ matrix.frontend }}-dev
        continue-on-error: true

      - name: Deploy summary
        run: |
          echo "## Deploy: ${{ matrix.frontend }}" >> $GITHUB_STEP_SUMMARY
          echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | Development |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | https://${{ matrix.frontend }}-dev.ggx-insurance.pages.dev |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** Deployment requires CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to be configured." >> $GITHUB_STEP_SUMMARY

  pipeline-status:
    name: Pipeline Status
    needs: [compile-nodes, build-nodes, test-nodes, package, build-docker, validate, security, smoke-test, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate pipeline report
        run: |
          echo "## Enterprise Pipeline Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 1. Compile Nodes | ${{ needs.compile-nodes.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 2. Build Nodes | ${{ needs.build-nodes.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 3. Test Nodes | ${{ needs.test-nodes.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 4. Package | ${{ needs.package.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 5. Build Docker | ${{ needs.build-docker.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 6. Validate | ${{ needs.validate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 7. Security | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 8. Smoke Test | ${{ needs.smoke-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 9. Deploy | ${{ needs.deploy.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\` | **Commit:** \`${{ github.sha }}\` | **Actor:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.compile-nodes.result }}" == "failure" ] || \
             [ "${{ needs.build-nodes.result }}" == "failure" ] || \
             [ "${{ needs.test-nodes.result }}" == "failure" ] || \
             [ "${{ needs.validate.result }}" == "failure" ] || \
             [ "${{ needs.security.result }}" == "failure" ] || \
             [ "${{ needs.smoke-test.result }}" == "failure" ]; then
            echo "::error::Pipeline failed - check failed stages above"
            exit 1
          fi
