name: PR - Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [dev, Staging/uat, production]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  pr-metadata:
    name: PR Metadata
    runs-on: ubuntu-latest
    outputs:
      changed_frontends: ${{ steps.changes.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            admin-console: admin-console/**
            customer-portal: customer-portal/**
            executive-dashboard: executive-dashboard/**
            hr-portal: hr-portal/**
            digital-sales-portal: digital-sales-portal/**
            support-center: support-center/**
            broker-portal: broker-portal/**

  pr-build-check:
    name: Build Check - ${{ matrix.frontend }}
    needs: pr-metadata
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        frontend: ${{ fromJson(needs.pr-metadata.outputs.changed_frontends) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.frontend }}/package.json

      - name: Install
        working-directory: ${{ matrix.frontend }}
        run: |
          npm install --install-strategy=nested --legacy-peer-deps
          npm install @esbuild/linux-x64 --save-dev || true

      - name: Type check
        working-directory: ${{ matrix.frontend }}
        run: npx tsc --noEmit

      - name: Build
        working-directory: ${{ matrix.frontend }}
        run: npm run build

      - name: Bundle analysis
        working-directory: ${{ matrix.frontend }}
        run: |
          if [ -d "dist" ]; then
            SIZE=$(du -sh dist | cut -f1)
            echo "BUILD_SIZE=${SIZE}" >> $GITHUB_ENV
            echo "**${{ matrix.frontend }}**: Bundle size = ${SIZE}" >> $GITHUB_STEP_SUMMARY
          fi

  pr-quality-gate:
    name: Quality Gate
    needs: pr-build-check
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate check
        run: |
          if [ "${{ needs.pr-build-check.result }}" == "failure" ]; then
            echo "::error::Quality gate failed - build errors detected"
            exit 1
          fi
          echo "✅ Quality gate passed" >> $GITHUB_STEP_SUMMARY
