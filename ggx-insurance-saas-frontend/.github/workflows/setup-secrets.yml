name: Setup Cloudflare Secrets

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Install sodium
        run: npm install libsodium-wrappers

      - name: Set secrets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACCOUNT_ID: ${{ secrets._CF_ACCOUNT_ID }}
          API_TOKEN: ${{ secrets._CF_API_TOKEN }}
        run: |
          node -e "
          const sodium = require('libsodium-wrappers');
          const https = require('https');
          const crypto = require('crypto');

          async function setSecret(name, value) {
            await sodium.ready;
            const token = process.env.GH_TOKEN;
            const repo = '${{ github.repository }}';

            // Get public key
            const pkRes = await fetch('https://api.github.com/repos/' + repo + '/actions/secrets/public-key', {
              headers: { Authorization: 'token ' + token, Accept: 'application/vnd.github+json' }
            });
            const pkData = await pkRes.json();

            // Encrypt
            const pk = sodium.from_base64(pkData.key, sodium.base64_variants.ORIGINAL);
            const msg = sodium.from_string(value);
            const sealed = sodium.crypto_box_seal(msg, pk);
            const encB64 = sodium.to_base64(sealed, sodium.base64_variants.ORIGINAL);

            // Set secret
            const res = await fetch('https://api.github.com/repos/' + repo + '/actions/secrets/' + name, {
              method: 'PUT',
              headers: { Authorization: 'token ' + token, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
              body: JSON.stringify({ encrypted_value: encB64, key_id: pkData.key_id })
            });
            console.log(name + ': ' + res.status);
          }

          Promise.all([
            setSecret('CLOUDFLARE_ACCOUNT_ID', process.env.ACCOUNT_ID),
            setSecret('CLOUDFLARE_API_TOKEN', process.env.API_TOKEN)
          ]);
          "
